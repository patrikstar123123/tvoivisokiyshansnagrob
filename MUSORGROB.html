<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpgradeCoins — CS:GO Skin Upgrader</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent-green: #00ff88;
            --accent-green-glow: rgba(0, 255, 136, 0.4);
            --accent-purple: #a855f7;
            --accent-purple-glow: rgba(168, 85, 247, 0.4);
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Bahnschrift', 'Arial Narrow', 'Trebuchet MS', sans-serif; user-select: none; }
        body {
            background-color: var(--bg-dark);
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(7, 12, 20, 0.78);
            z-index: -1;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.5rem; font-weight: 800; letter-spacing: 1px;
            color: #f1f5f9; text-transform: uppercase;
        }
        .logo-icon { width: 32px; height: 32px; fill: #d7dee8; }
        .header-controls { display: flex; align-items: center; gap: 1.5rem; }
        .balance-container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 1.1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .balance-icon { font-size: 1.2rem; }
        .btn-refill {
            background: #d9dee5; color: #111827;
            border: none; padding: 0.6rem 1.2rem;
            border-radius: 12px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-refill:hover { filter: brightness(1.04); }
        .main-container {
            max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem;
            width: 100%; display: flex; flex-direction: column;
            gap: 2rem; flex-grow: 1;
        }
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 380px 1fr;
            gap: 1.5rem; align-items: start;
        }
        @media (max-width: 1100px) {
            .game-grid { grid-template-columns: 1fr; }
        }
        .panel {
            background: rgba(20, 27, 39, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.22);
            height: 700px; min-height: 0;
        }
        .panel-title {
            font-size: 1.1rem; font-weight: 700; color: #ffffff;
            text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem; flex-shrink: 0;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
            overflow-y: auto; overflow-x: hidden;
            padding: 2px 4px 8px 0;
            flex: 1 1 auto; min-height: 0;
            align-content: start;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        .items-grid::-webkit-scrollbar { width: 6px; }
        .items-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .items-grid::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .item-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 4px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
            min-height: 100px; min-width: 0;
        }
        .item-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--rarity-color, #fff);
        }
        .item-card:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.2); }
        .item-card.selected { border-color: #b8c2cf; background: rgba(0, 255, 136, 0.08); }
        .item-card.selected-target { border-color: #c1cad6; background: rgba(168, 85, 247, 0.08); }
        .item-img { width: 60px; height: 42px; object-fit: contain; margin: 2px 0; }
        .item-name {
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 3px;
            line-height: 1.15;
            max-width: 100%;
        }
                .item-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffd700;
            margin-top: 3px;
            line-height: 1.1;
            letter-spacing: 0.3px;
        }
        .sell-btn {
            background: rgba(239, 68, 68, 0.15); color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 4px; padding: 1px 6px;
            font-size: 0.6rem; cursor: pointer; margin-top: 3px;
            transition: 0.2s; font-weight: 700;
        }
        .sell-btn:hover { background: var(--accent-red); color: #fff; }
        .buy-btn {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.35);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.6rem;
            cursor: pointer;
            margin-top: 3px;
            transition: 0.2s;
            font-weight: 700;
        }
        .buy-btn:hover { background: #00ff88; color: #111827; }
        .buy-btn:disabled {
            background: rgba(120, 120, 120, 0.15);
            color: #6b7280;
            border-color: rgba(120, 120, 120, 0.3);
            cursor: not-allowed;
        }

        .game-grid > .panel:first-child,
        .game-grid > .panel:last-child {
            background-image: linear-gradient(rgba(30, 41, 59, 0.86), rgba(30, 41, 59, 0.92)), url('back2.png');
            background-size: cover; background-position: center;
        }

        #inventorySection, #shopGrid {
            min-height: 0; flex: 1 1 0;
            overflow-y: auto; overflow-x: hidden;
        }

        .roulette-panel {
            background: rgba(20, 27, 39, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 1.5rem;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            box-shadow: 0 8px 18px rgba(0,0,0,0.22);
            height: 700px;
        }
        .roulette-wrapper {
            position: relative; width: 280px; height: 280px;
            display: flex; align-items: center; justify-content: center;
            margin: auto 0;
        }
        .svg-wheel { width: 100%; height: 100%; transform: rotate(-90deg); }
        .wheel-bg-track { fill: none; stroke: rgba(15, 23, 42, 0.8); stroke-width: 18; }
                        .wheel-progress {
            fill: none;
            stroke: url(#greenGradient);
            stroke-width: 18;
            stroke-dasharray: 753.98;
            stroke-dashoffset: 753.98;
            transition: stroke-dashoffset 0.3s ease;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px rgba(120, 160, 70, 0.5));
        }
        .needle-container {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; pointer-events: none;
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .needle {
            position: absolute; top: 10px; left: calc(50% - 8px);
            width: 16px; height: 24px; fill: #e8edf3;
        }
        .wheel-center-info {
            position: absolute; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .chance-text { font-size: 2.2rem; font-weight: 900; color: #f1f5f9; line-height: 1; }
        .multiplier-text { font-size: 1.1rem; font-weight: 700; color: #b7c0cc; margin-top: 4px; }
        .chance-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .btn-upgrade {
            width: 100%; padding: 1rem; border: none;
            border-radius: 14px; background: #d9dee5; color: #111827;
            font-size: 1.2rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
        }
        .btn-upgrade:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .selected-preview {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: rgba(15, 23, 42, 0.6);
            padding: 10px 14px; border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem; flex-shrink: 0;
        }
        .preview-box { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .preview-box strong {
            max-width: 130px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-size: 0.8rem;
        }

        .history-section {
            background: rgba(20, 27, 39, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 1.2rem;
            display: flex; flex-direction: column; gap: 1rem;
            background-image: linear-gradient(rgba(20, 27, 39, 0.88), rgba(20, 27, 39, 0.94)), url('back4.png');
            background-size: cover; background-position: center;
        }
        .history-feed { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
        .history-card {
            min-width: 200px; background: rgba(15, 23, 42, 0.7);
            border-radius: 12px; padding: 10px 14px;
            border-left: 4px solid var(--border-color);
            display: flex; flex-direction: column; gap: 4px;
        }
        .history-card.win { border-left-color: var(--accent-green); }
        .history-card.lose { border-left-color: var(--accent-red); }
        .history-status { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; }
        .history-status.win { color: var(--accent-green); }
        .history-status.lose { color: var(--accent-red); }
        .history-item-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-details { font-size: 0.75rem; color: var(--text-muted); }
        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 16px 24px; border-radius: 12px;
            background: var(--bg-card); color: #fff; font-weight: 700;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s ease; z-index: 1000;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.win { border-color: var(--accent-green); }
        .toast.lose { border-color: var(--accent-red); }

        .shop-layout { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; min-height: 0; flex: 1 1 0; overflow: hidden; }
        .shop-sidebar { display:flex; flex-direction:column; gap:6px; min-height:0; overflow-y:auto; padding:5px; background: rgba(8,12,18,.35); border:1px solid rgba(255,255,255,.06); border-radius:12px; }
        .category-btn { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; padding:10px 10px; border:0; border-radius:8px; background:transparent; color:#9ba7b7; cursor:pointer; text-align:left; font-weight:600; flex:0 0 auto; }
        .category-btn:hover { background:rgba(255,255,255,.045); color:#eef2f7; }
        .category-btn.active { background:#2a3340; color:#fff; }
        .category-btn b { min-width:22px; text-align:center; font-size:.72rem; color:#778394; font-weight:700; }
        .shop-content { min-width:0; min-height:0; height:100%; display:flex; flex-direction:column; gap:8px; }
        .shop-toolbar { display:flex; flex:0 0 auto; justify-content:space-between; align-items:center; color:#a9b3c1; font-size:.75rem; padding:0 2px; }
        .shop-toolbar span:first-child { color:#e7ebf0; font-weight:700; }
        .value-accent { color:#d8dee7 !important; }
        @media (max-width: 1100px) {
            .shop-layout { grid-template-columns: 1fr; }
            .shop-sidebar { flex-direction:row; overflow-x:auto; }
            .category-btn { min-width:105px; }
            .panel, .roulette-panel { height: auto; min-height: 520px; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }

        .case-section {
            max-width: 1352px;
            width: calc(100% - 3rem);
            margin: 0 auto 2.5rem;
            background: rgba(20, 27, 39, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 18px 20px 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.22);
            overflow: hidden;
            background-image: linear-gradient(rgba(20, 27, 39, 0.88), rgba(20, 27, 39, 0.94)), url('back3.png');
            background-size: cover; background-position: center;
        }
        .case-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .case-tab {
            flex: 1;
            min-width: 140px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            text-align: left;
            color: #b7c0cc;
            font-family: inherit;
            transition: 0.15s;
        }
        .case-tab:hover { background: rgba(30, 41, 59, 0.7); }
        .case-tab.active {
            border-color: #b8c2cf;
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
        .case-tab .case-tab-name { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px; display: block; }
        .case-tab .case-tab-price { font-size: 0.72rem; color: #ffd700; font-weight: 700; margin-top: 3px; display: block; }
        .case-tab .case-tab-sub { font-size: 0.68rem; color: #8892a0; margin-top: 2px; display: block; }
        .case-tab.active .case-tab-sub { color: #b7c0cc; }

        .case-header, .case-controls { display:flex; align-items:center; justify-content:space-between; gap:16px; }
        .case-title { font-size: 1rem; font-weight: 800; letter-spacing: 1.5px; color:#fff; }
        .case-subtitle { margin-top:3px; font-size:.72rem; color:#aeb7c4; }
        .case-status { font-size:.85rem; font-weight:800; color:#fff; }
        .case-window {
            position:relative; height:126px; margin:14px 0 16px; overflow:hidden;
            border:1px solid rgba(255,255,255,.07); border-radius:14px;
            background:rgba(7,12,18,.6);
        }
        .case-window::before, .case-window::after {
            content:''; position:absolute; top:0; width:80px; height:100%; z-index:2; pointer-events:none;
        }
        .case-window::before { left:0; background:linear-gradient(90deg, rgba(7,12,18,.95), transparent); }
        .case-window::after { right:0; background:linear-gradient(270deg, rgba(7,12,18,.95), transparent); }
        .case-center-line {
            position:absolute; z-index:3; top:0; bottom:0; left:50%; width:2px;
            transform:translateX(-50%); background:#fff; opacity:.9;
        }
        .case-track {
            height:100%; display:flex; align-items:center; gap:10px;
            width:max-content; transform:translateX(0); will-change:transform;
        }
        .case-card {
            flex:0 0 128px; width:128px; min-width:0; height:96px; overflow:hidden;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:7px; border:1px solid rgba(255,255,255,.08); border-radius:10px;
            background:rgba(20,27,39,.9);
        }
        .case-card img { width:92px; height:52px; object-fit:contain; }
        .case-card span { width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; margin-top:3px; font-size:.62rem; color:#fff; }
        .case-card b { font-size:.65rem; color:#d9dee7; margin-top:2px; }
        .case-open-btn {
            border:0; border-radius:10px; padding:10px 18px; background:#fff; color:#111827;
            font-family:inherit; font-weight:800; cursor:pointer;
        }
        .case-open-btn:hover { background:#e5e7eb; }
        .case-open-btn:disabled { background:#3a4350; color:#7d8794; cursor:not-allowed; }
        .case-timer { font-size:.74rem; color:#b7c0cc; }

        .currency-switcher {
            display: flex; gap: 3px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px; border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .cur-btn {
            padding: 6px 10px; border: none; background: transparent;
            color: var(--text-muted); border-radius: 6px; cursor: pointer;
            font-weight: 700; font-size: 0.75rem; transition: 0.15s;
        }
        .cur-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .cur-btn.active { background: #2a3340; color: #fff; }
        @media (max-width: 700px) { .currency-switcher { display: none; } }
    </style>
</head>
<body>

    

    <audio id="soundUpgradeSpin" src="sound1.mp3" preload="auto" loop></audio>
    <audio id="soundCaseSpin" src="sound2.mp3" preload="auto"></audio>
    <audio id="soundWin" src="sound_win.mp3" preload="auto"></audio>
    <audio id="soundLose" src="sound_lose.mp3" preload="auto"></audio>
   

    <header>
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            Skin Upgrader
        </div>
        <div class="header-controls">
            <div class="balance-container">
                <span class="balance-icon"></span>
                <span id="userBalance">$10.00</span>
            </div>
            <div class="currency-switcher">
                <button class="cur-btn active" data-cur="USD" onclick="setCurrency('USD')">$ USD</button>
                <button class="cur-btn" data-cur="UAH" onclick="setCurrency('UAH')">₴ UAH</button>
                <button class="cur-btn" data-cur="RUB" onclick="setCurrency('RUB')">₽ RUB</button>
            </div>
            <button class="btn-refill" id="refillBtn"><span>+</span> $10</button>
        </div>
    </header>

    <main class="main-container">
        <div class="game-grid">

            <section class="panel">
                <div class="panel-title">
                    <span>1. Ваша ставка</span>
                    <span id="betValueDisplay" style="color: var(--accent-green);">$0.00</span>
                </div>
                <div id="inventorySection" class="items-grid"></div>
            </section>

            <section class="roulette-panel">
                <div class="panel-title" style="width: 100%;"><span>UPGRADE</span></div>
                <div class="roulette-wrapper">
                    <svg class="svg-wheel" viewBox="0 0 300 300">
                        <defs>
                                <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#32CD32" />
                                <stop offset="100%" stop-color="#00FF00" />
                            </linearGradient>
                        </defs>
                        <circle class="wheel-bg-track" cx="150" cy="150" r="120"></circle>
                        <circle id="wheelProgress" class="wheel-progress" cx="150" cy="150" r="120"></circle>
                    </svg>
                    <div class="needle-container" id="needleContainer">
                        <svg class="needle" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z"></path></svg>
                    </div>
                    <div class="wheel-center-info">
                        <div class="chance-text" id="chanceDisplay">0.00%</div>
                        <div class="multiplier-text" id="multiplierDisplay">x0.00</div>
                        <div class="chance-label">Шанс успеха</div>
                    </div>
                </div>
                <div class="selected-preview">
                    <div class="preview-box"><strong id="previewBetText">—</strong></div>
                    <span style="color: var(--accent-purple); font-weight: bold;">➔</span>
                    <div class="preview-box"><strong id="previewTargetText">—</strong></div>
                </div>
                <button class="btn-upgrade" id="upgradeBtn" disabled onclick="startUpgrade()">Upgrade</button>
            </section>

            <section class="panel shop-panel">
                <div class="panel-title">
                    <span>2. Выберите цель</span>
                    <span id="targetValueDisplay" class="value-accent">$0.00</span>
                </div>
                <div class="shop-layout">
                    <aside class="shop-sidebar" aria-label="Категории предметов">
                        <button class="category-btn active" data-category="all" onclick="setShopCategory('all')"><span>Все</span><b id="count-all">0</b></button>
                        <button class="category-btn" data-category="knives" onclick="setShopCategory('knives')"><span>Ножи</span><b id="count-knives">0</b></button>
                        <button class="category-btn" data-category="rifles" onclick="setShopCategory('rifles')"><span>Винтовки</span><b id="count-rifles">0</b></button>
                        <button class="category-btn" data-category="pistols" onclick="setShopCategory('pistols')"><span>Пистолеты</span><b id="count-pistols">0</b></button>
                        <button class="category-btn" data-category="smgs" onclick="setShopCategory('smgs')"><span>ПП</span><b id="count-smgs">0</b></button>
                        <button class="category-btn" data-category="shotguns" onclick="setShopCategory('shotguns')"><span>Дробовики</span><b id="count-shotguns">0</b></button>
                        <button class="category-btn" data-category="gloves" onclick="setShopCategory('gloves')"><span>Перчатки</span><b id="count-gloves">0</b></button>
                    </aside>
                    <div class="shop-content">
                        <div class="shop-toolbar">

        // ==================== ФОРМАТ ЦЕНЫ ====================
        function formatPrice(usd) {
            const rate = state.rates[state.currency] || 1;
            const v = usd * rate;
            if (state.currency === 'USD') return '$' + v.toFixed(2);
            if (state.currency === 'UAH') return Math.round(v).toLocaleString('ru-RU') + ' ₴';
            if (state.currency === 'RUB') return Math.round(v).toLocaleString('ru-RU') + ' ₽';
            return '$' + v.toFixed(2);
        }

        function setCurrency(cur) {
            state.currency = cur;
            document.querySelectorAll('.cur-btn').forEach(b => b.classList.toggle('active', b.dataset.cur === cur));
            renderBalance();
            renderInventory();
            renderShop();
            renderCaseTabs();
            renderCaseTrack();
            calculateChance();
            renderHistory();
            updateCaseTimer();
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        const STARTER_SKIN = SHOP_ITEMS.find(item => item.id === 'c-glock-ground') || SHOP_ITEMS[0];
        state.inventory = STARTER_SKIN ? [{ ...STARTER_SKIN, id: `inv_${STARTER_SKIN.id}` }] : [];

        function getActiveCase() {
            return CASES.find(c => c.id === state.activeCaseId) || CASES[0];
        }

        function renderBalance() {
            document.getElementById('userBalance').innerText = formatPrice(state.balance);
        }

        function renderInventory() {
            const container = document.getElementById('inventorySection');
            container.innerHTML = '';
            if (state.inventory.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Инвентарь пуст. Купите скин в магазине или откройте кейс!</div>';
                return;
            }
            const selectedIds = new Set(state.selectedInventoryItems.map(i => i.id));
            state.inventory.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${selectedIds.has(item.id) ? 'selected' : ''}`;
                card.style.setProperty('--rarity-color', item.rarityColor);
                card.innerHTML = `
                    <img src="${item.image}" class="item-img" alt="${item.name}" onerror="this.src='${SVG_WEAPON_FALLBACK}'">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${formatPrice(item.price)}</div>
                    <button class="sell-btn" onclick="sellItem(event, '${item.id}')">Продать</button>
                `;
                card.addEventListener('click', (e) => { if (!e.target.classList.contains('sell-btn')) selectInventoryItem(item); });
                container.appendChild(card);
            });
        }

        const CATEGORY_LABELS = {
            all: 'Все предметы', knives: 'Ножи', rifles: 'Винтовки', pistols: 'Пистолеты',
            smgs: 'ПП', shotguns: 'Дробовики', gloves: 'Перчатки'
        };

        function itemCategory(item) {
            if (item.category) return item.category;
            const n = item.name.toLowerCase();
            if (n.includes('glove') || n.includes('wraps')) return 'gloves';
            if (n.startsWith('★')) return 'knives';
            if (/ak-47|m4a|m4a1|awp|ssg|scar|aug|famas|galil|sg 553|g3sg1|scar-20|ssg 08/.test(n)) return 'rifles';
            if (/deagle|glock|usp|p250|five-seven|five seven|tec-9|cz75|r8 revolver|p2000|dual berettas|berettas/.test(n)) return 'pistols';
            if (/mac-10|mp9|mp7|mp5|ump-45|p90|pp-bizon|bizon|mp5-sd/.test(n)) return 'smgs';
            if (/nova|xm1014|mag-7|sawed-off/.test(n)) return 'shotguns';
            return 'rifles';
        }

        function setShopCategory(category) {
            if (state.isSpinning) return;
            state.shopCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.category === category));
            renderShop();
        }

        function renderCategoryCounts() {
            const counts = { all: SHOP_ITEMS.length, knives: 0, rifles: 0, pistols: 0, smgs: 0, shotguns: 0, gloves: 0 };
            SHOP_ITEMS.forEach(item => { counts[itemCategory(item)] = (counts[itemCategory(item)] || 0) + 1; });
            Object.entries(counts).forEach(([key, value]) => {
                const el = document.getElementById('count-' + key);
                if (el) el.textContent = value;
            });
        }

        function renderShop() {
            const container = document.getElementById('shopGrid');
            const title = document.getElementById('categoryTitle');
            const catalogCount = document.getElementById('catalogCount');
            container.innerHTML = '';
            const filtered = state.shopCategory === 'all'
                ? SHOP_ITEMS
                : SHOP_ITEMS.filter(item => itemCategory(item) === state.shopCategory);
            title.textContent = CATEGORY_LABELS[state.shopCategory];
            catalogCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'предмет' : filtered.length < 5 ? 'предмета' : 'предметов'}`;
            filtered.forEach(item => {
                const canAfford = state.balance >= item.price;
                const card = document.createElement('div');
                card.className = `item-card ${state.selectedTargetItem?.id === item.id ? 'selected-target' : ''}`;
                card.style.setProperty('--rarity-color', item.rarityColor);
                card.innerHTML = `
                    <img src="${item.image}" class="item-img" alt="${item.name}" onerror="this.src='${SVG_WEAPON_FALLBACK}'">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${formatPrice(item.price)}</div>
                    <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyItem(event, '${item.id}')">${canAfford ? 'Купить' : 'Мало $'}</button>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('buy-btn')) selectTargetItem(item);
                });
                container.appendChild(card);
            });
            renderCategoryCounts();
        }

        function selectInventoryItem(item) {
            if (state.isSpinning) return;
            const idx = state.selectedInventoryItems.findIndex(i => i.id === item.id);
            if (idx !== -1) {
                state.selectedInventoryItems.splice(idx, 1);
            } else {
                state.selectedInventoryItems.push(item);
            }
            renderInventory();
            calculateChance();
        }

        function selectTargetItem(item) {
            if (state.isSpinning) return;
            state.selectedTargetItem = item;
            renderShop();
            calculateChance();
        }

        function sellItem(event, itemId) {
            event.stopPropagation();
            if (state.isSpinning) return;
            const idx = state.inventory.findIndex(i => i.id === itemId);
            if (idx !== -1) {
                const item = state.inventory[idx];
                state.balance += item.price;
                state.selectedInventoryItems = state.selectedInventoryItems.filter(i => i.id !== itemId);
                state.inventory.splice(idx, 1);
                renderBalance();
                renderInventory();
                renderShop();
                calculateChance();
                showToast(`Продано ${item.name} за +${formatPrice(item.price)}`, 'win');
            }
        }

        function buyItem(event, itemId) {
            event.stopPropagation();
            if (state.isSpinning) return;
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;
            if (state.balance < item.price) {
                showToast('Недостаточно средств!', 'lose');
                return;
            }
            state.balance -= item.price;
            state.inventory.unshift({ ...item, id: 'buy_' + Date.now() + '_' + Math.floor(Math.random() * 1000) });
            renderBalance();
            renderInventory();
            renderShop();
            calculateChance();
            showToast(`Куплено: ${item.name} за ${formatPrice(item.price)}`, 'win');
        }

        // ==================== РАСЧЁТ ШАНСА ====================
        function getBetValue() {
            return state.selectedInventoryItems.reduce((sum, it) => sum + it.price, 0);
        }

        function calculateChance() {
            const betVal = getBetValue();
            const targetVal = state.selectedTargetItem ? state.selectedTargetItem.price : 0;
            document.getElementById('betValueDisplay').innerText = formatPrice(betVal);
            document.getElementById('targetValueDisplay').innerText = formatPrice(targetVal);

            const n = state.selectedInventoryItems.length;
            const betPreviewEl = document.getElementById('previewBetText');
            if (n === 0) {
                betPreviewEl.innerText = 'Не выбрано';
            } else if (n === 1) {
                betPreviewEl.innerText = state.selectedInventoryItems[0].name;
            } else {
                betPreviewEl.innerText = `${state.selectedInventoryItems[0].name} +${n - 1}`;
            }

            document.getElementById('previewTargetText').innerText = state.selectedTargetItem ? state.selectedTargetItem.name : 'Не выбрано';

            const upgradeBtn = document.getElementById('upgradeBtn');
            if (betVal <= 0 || targetVal <= 0) {
                updateWheelUI(0, 0);
                upgradeBtn.disabled = true;
                return;
            }
            let chance = (betVal / targetVal) * 85;
            let multiplier = targetVal / betVal;
            if (chance > 95) chance = 95;
            updateWheelUI(chance, multiplier);
            upgradeBtn.disabled = false;
        }

        function updateWheelUI(chance, multiplier) {
            document.getElementById('chanceDisplay').innerText = `${chance.toFixed(2)}%`;
            document.getElementById('multiplierDisplay').innerText = `x${multiplier.toFixed(2)}`;
            const circumference = 753.98;
            const offset = circumference - (chance / 100) * circumference;
            document.getElementById('wheelProgress').style.strokeDashoffset = offset;
        }

        // ==================== АПГРЕЙД ====================
                function startUpgrade() {
            if (state.isSpinning) return;
            if (state.selectedInventoryItems.length === 0 || !state.selectedTargetItem) return;

            const betVal = getBetValue();
            const targetVal = state.selectedTargetItem.price;

            const usedItems = [...state.selectedInventoryItems];
            const targetItem = state.selectedTargetItem;

            let chance = (betVal / targetVal) * 85;
            if (chance > 95) chance = 95;
            const multiplier = targetVal / betVal;

            state.isSpinning = true;
            document.getElementById('upgradeBtn').disabled = true;

            const usedIds = new Set(usedItems.map(i => i.id));
            state.inventory = state.inventory.filter(i => !usedIds.has(i.id));
            state.selectedInventoryItems = [];
            renderInventory();

            updateWheelUI(chance, multiplier);

            // === ЗВУК ПРОКРУТКИ ===
            playSound('soundUpgradeSpin', { loop: true });

            const isWin = Math.random() * 100 <= chance;
            const winningSectorDegrees = (chance / 100) * 360;
            let landingDegree = isWin
                ? Math.random() * (winningSectorDegrees - 2) + 1
                : winningSectorDegrees + Math.random() * (360 - winningSectorDegrees - 2) + 1;

            const totalRotation = state.currentRotation + 1800 + (360 - (state.currentRotation % 360)) + landingDegree;
            state.currentRotation = totalRotation;
            document.getElementById('needleContainer').style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                // === СТОП ЗВУКА ПРОКРУТКИ ===
                stopSound('soundUpgradeSpin');

                handleResult(isWin, targetItem, chance);

                state.selectedTargetItem = null;
                renderShop();

                state.isSpinning = false;
                calculateChance();
            }, 3500);
        }
                function handleResult(isWin, targetItem, chance) {
            if (isWin) {
                const newSkin = { ...targetItem, id: 'win_' + Date.now() };
                state.inventory.unshift(newSkin);
                renderInventory();
                playSound('soundWin');
                showToast(`УСПЕХ! Вы получили ${targetItem.name}!`, 'win');
            } else {
                playSound('soundLose');
                showToast(`НЕУДАЧА! Апгрейд сорвался.`, 'lose');
            }
            addHistoryRecord(isWin, targetItem, chance);
        }

        // ==================== ИСТОРИЯ ====================
        const _history = [];

        function addHistoryRecord(isWin, item, chance) {
            _history.unshift({ isWin, item, chance });
            if (_history.length > 5) _history.pop();
            renderHistory();
        }

        function renderHistory() {
            const feed = document.getElementById('historyFeed');
            feed.innerHTML = '';
            _history.forEach(rec => {
                const card = document.createElement('div');
                card.className = `history-card ${rec.isWin ? 'win' : 'lose'}`;
                card.innerHTML = `
                    <div class="history-status ${rec.isWin ? 'win' : 'lose'}">
                        <span>${rec.isWin ? 'УСПЕШНО' : 'ПРОИГРЫШ'}</span>
                        <span>${rec.chance.toFixed(1)}%</span>
                    </div>
                    <div class="history-item-name">${rec.item.name}</div>
                    <div class="history-details">${formatPrice(rec.item.price)}</div>
                `;
                feed.appendChild(card);
            });
        }

        function showToast(message, type = 'win') {
            const toast = document.getElementById('toast');
            toast.className = `toast ${type} show`;
            toast.innerText = message;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

                // ==================== ЗВУКИ ====================
        function playSound(id, opts = {}) {
            const el = document.getElementById(id);
            if (!el) return;
            try {
                el.currentTime = 0;
                el.loop = !!opts.loop;
                el.volume = 0.75;
                el.play().catch(() => { /* браузер может блокировать до первого клика */ });
            } catch (e) { /* ignore */ }
        }

        function stopSound(id) {
            const el = document.getElementById(id);
            if (!el) return;
            try {
                el.pause();
                el.currentTime = 0;
            } catch (e) { /* ignore */ }
        }

        // ==================== КЕЙСЫ ====================
        let caseTimerInterval = null;

        function getCasePool(c) {
            return SHOP_ITEMS.filter(it => it.price >= c.min && it.price <= c.max);
        }

        function getCaseWeight(item, tier) {
            const price = item.price || 0;
            if (tier === 'common') {
                if (price <= 0.5) return 55;
                if (price <= 2) return 25;
                if (price <= 5) return 8;
                return 0.5;
            }
            if (tier === 'rare') {
                if (price <= 10) return 50;
                if (price <= 30) return 25;
                if (price <= 50) return 8;
                return 0.5;
            }
            if (tier === 'epic') {
                if (price <= 100) return 50;
                if (price <= 200) return 25;
                if (price <= 300) return 8;
                return 0.5;
            }
            if (price <= 500) return 40;
            if (price <= 1000) return 25;
            if (price <= 2000) return 8;
            return 1;
        }

        function pickWeightedCaseItem(pool, tier) {
            const totalWeight = pool.reduce((sum, item) => sum + getCaseWeight(item, tier), 0);
            let roll = Math.random() * totalWeight;
            for (const item of pool) {
                roll -= getCaseWeight(item, tier);
                if (roll <= 0) return item;
            }
            return pool[pool.length - 1];
        }

        function renderCaseTabs() {
            const el = document.getElementById('caseTabs');
            if (!el) return;
            el.innerHTML = CASES.map(c => {
                const isFree = c.price <= FREE_CASE_LIMIT;
                return `
                <button class="case-tab ${state.activeCaseId === c.id ? 'active' : ''}" onclick="setActiveCase('${c.id}')">
                    <span class="case-tab-name">${c.title}${isFree ? ' · FREE' : ''}</span>
                    <span class="case-tab-price">${formatPrice(c.price)}</span>
                    <span class="case-tab-sub">${c.subtitle}</span>
                </button>`;
            }).join('');
        }

        function setActiveCase(id) {
            if (state.caseOpening) return;
            state.activeCaseId = id;
            const c = getActiveCase();
            document.getElementById('caseTitle').textContent = c.title;
            document.getElementById('caseSubtitle').textContent = c.subtitle;
            renderCaseTabs();
            renderCaseTrack();
            updateCaseTimer();
        }

        function renderCaseTrack() {
            const track = document.getElementById('caseTrack');
            const c = getActiveCase();
            const pool = getCasePool(c);
            if (!track) return;
            if (!pool.length) {
                track.innerHTML = '<div style="padding: 20px; color: #b7c0cc;">Нет предметов в этом кейсе</div>';
                return;
            }
            const items = [];
            for (let i = 0; i < 48; i++) {
                items.push(pool[i % pool.length]);
            }
            track.innerHTML = items.map(item => `
                <div class="case-card">
                    <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='${SVG_WEAPON_FALLBACK}'">
                    <span>${item.name}</span>
                    <b>${formatPrice(item.price)}</b>
                </div>
            `).join('');
            track.style.transition = 'none';
            track.style.transform = 'translate3d(0, 0, 0)';
        }

        function updateCaseTimer() {
            const c = getActiveCase();
            const timer = document.getElementById('caseTimer');
            const button = document.getElementById('caseOpenBtn');
            const status = document.getElementById('caseStatus');
            if (!timer || !button || !status) return;

            const isFree = c.price <= FREE_CASE_LIMIT;
            const freeAvailable = isFree && Date.now() >= state.caseReadyAt[c.id];

            if (freeAvailable) {
                timer.textContent = 'Бесплатное открытие доступно';
                status.textContent = 'FREE';
                button.textContent = 'Открыть бесплатно';
                button.disabled = state.caseOpening;
            } else if (isFree) {
                const left = Math.max(0, state.caseReadyAt[c.id] - Date.now());
                const sec = Math.ceil(left / 1000);
                timer.textContent = `Бесплатно через ${sec} сек`;
                status.textContent = formatPrice(c.price);
                button.textContent = 'Открыть за ' + formatPrice(c.price);
                button.disabled = state.caseOpening;
            } else {
                timer.textContent = 'Только платное открытие';
                status.textContent = formatPrice(c.price);
                button.textContent = 'Открыть за ' + formatPrice(c.price);
                button.disabled = state.caseOpening;
            }
        }

                function openCase() {
            if (state.caseOpening) return;
            const c = getActiveCase();

            const isFree = c.price <= FREE_CASE_LIMIT;
            const free = isFree && Date.now() >= state.caseReadyAt[c.id];

            if (!free && state.balance < c.price) {
                showToast('Недостаточно средств для кейса!', 'lose');
                return;
            }

            const pool = getCasePool(c);
            if (!pool.length) return;

            const track = document.getElementById('caseTrack');
            const cards = [...track.children];
            if (!cards.length) return;

            const winner = pickWeightedCaseItem(pool, c.tier);

            if (!free) {
                state.balance -= c.price;
                renderBalance();
            }

            state.caseOpening = true;
            updateCaseTimer();

            // === ЗВУК ОТКРЫТИЯ КЕЙСА ===
            playSound('soundCaseSpin');

            const winnerIndex = Math.min(38, cards.length - 1);
            const winnerCard = cards[winnerIndex];
            winnerCard.innerHTML = `
                <img src="${winner.image}" alt="${winner.name}" onerror="this.src='${SVG_WEAPON_FALLBACK}'">
                <span>${winner.name}</span>
                <b>${formatPrice(winner.price)}</b>`;

            track.style.transition = 'none';
            track.style.transform = 'translate3d(0, 0, 0)';
            void track.offsetWidth;

            const windowEl = document.querySelector('.case-window');
            const center = windowEl.clientWidth / 2;
            const cardCenter = winnerCard.offsetLeft + winnerCard.offsetWidth / 2;
            const targetX = center - cardCenter;

            track.style.transition = 'transform 6.2s cubic-bezier(.08,.72,.12,1)';
            requestAnimationFrame(() => {
                track.style.transform = `translate3d(${targetX}px, 0, 0)`;
            });

            let finished = false;
            const finishOpening = () => {
                if (finished) return;
                finished = true;
                track.removeEventListener('transitionend', finishOpening);
                track.style.transition = 'none';

                state.inventory.unshift({ ...winner, id: 'case_' + Date.now() });
                if (isFree) {
                    state.caseReadyAt[c.id] = Date.now() + 60000;
                }
                state.caseOpening = false;

                renderInventory();
                calculateChance();
                showToast(`Кейс: ${winner.name}!`, 'win');
                renderCaseTrack();
                updateCaseTimer();
            };

            track.addEventListener('transitionend', finishOpening);
            setTimeout(finishOpening, 7000);
        }
        // ==================== ЗАПУСК ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderBalance();
            renderInventory();
            renderShop();
            renderCaseTabs();
            renderCaseTrack();
            updateCaseTimer();
            caseTimerInterval = setInterval(updateCaseTimer, 250);
            calculateChance();

            document.getElementById('refillBtn').addEventListener('click', () => {
                state.balance += 10;
                renderBalance();
                renderShop();
                calculateChance();
                showToast('+$10 зачислено!', 'win');
            });
        });
    </script>
</body>
</html>
